<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茶マンズLINE Complete (Admin & Unban Edition)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #7494C0;
      --header-bg: #273238;
      --my-msg-bg: #85E249;
      --other-msg-bg: #FFFFFF;
      --text-color: #111111;
      --time-color: #4A5568;
      --line-green: #06C755;
      --card-bg: #ffffff;
      --sub-bg: #f7f9fa;
      --border-color: #eee;
      --admin-gold: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.3s; }

    /* ダークモード定義 */
    body.dark-mode {
      --bg-color: #1a232a;
      --header-bg: #11181c;
      --my-msg-bg: #2e7d32;
      --other-msg-bg: #263238;
      --text-color: #eceff1;
      --time-color: #b0bec5;
      --card-bg: #1c252b;
      --sub-bg: #222d34;
      --border-color: #37474f;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background: var(--card-bg);
      display: flex;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      overflow: hidden;
      color: var(--text-color);
    }

    /* サイドバー */
    .sidebar {
      width: 320px;
      background: var(--sub-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .profile-header {
      padding: 15px;
      background: var(--header-bg);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .my-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .my-name {
      font-weight: bold;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .admin-badge {
      background: var(--admin-gold);
      color: #000;
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .my-id {
      font-size: 0.8em;
      opacity: 0.8;
      cursor: pointer;
    }

    .action-bar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: var(--line-green);
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85em;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #6c757d; }
    .btn-danger { background: #dc3545; }
    .btn-warning { background: #ffc107; color: #000; }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: var(--sub-bg);
      font-weight: bold;
      font-size: 0.9em;
    }

    .tab.active {
      background: var(--card-bg);
      border-bottom: 3px solid var(--line-green);
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
    }

    .list-item {
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .list-item:hover {
      background: rgba(0,0,0,0.05);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .item-details {
      flex: 1;
    }

    .item-title { font-weight: bold; }
    .item-sub { font-size: 0.8em; opacity: 0.7; }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }

    .chat-header {
      padding: 15px;
      background: var(--header-bg);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 70%;
    }

    .msg-row.my-msg {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-bubble {
      background: var(--other-msg-bg);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95em;
      position: relative;
      word-break: break-all;
    }

    .my-msg .msg-bubble {
      background: var(--my-msg-bg);
    }

    .msg-time {
      font-size: 0.7em;
      color: var(--time-color);
      align-self: flex-end;
    }

    .input-area {
      padding: 10px;
      background: var(--card-bg);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      outline: none;
      background: var(--sub-bg);
      color: var(--text-color);
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* 画像表示モーダル */
    .image-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .image-viewer.active { display: flex; }
    .image-viewer img { max-width: 90%; max-height: 90%; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="profile-header">
        <div class="my-info">
          <div class="my-name">
            <span id="display-name">ユーザー</span>
            <span id="admin-tag" class="admin-badge" style="display:none;">ADMIN</span>
          </div>
          <div class="my-id" onclick="copyMyId()" id="display-id">ID: 取得中... (クリックでコピー)</div>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn" onclick="openModal('add-friend-modal')">友達追加</button>
        <button class="btn" onclick="openModal('create-group-modal')">グループ作成</button>
        <button class="btn btn-warning" id="admin-btn" onclick="toggleAdminPanel()">管理者</button>
      </div>

      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('friends')">友達</div>
        <div class="tab" onclick="switchTab('groups')">グループ</div>
      </div>

      <div class="list-container" id="list-container">
        </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <h3 id="chat-title">チャット相手を選択してください</h3>
        <div id="chat-actions" style="display:none;">
          <button class="btn btn-secondary" id="add-member-btn" onclick="openAddMemberModal()">メンバー追加</button>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        </div>

      <div class="input-area">
        <label class="btn btn-secondary" style="margin:0; padding:8px;">
          📷 <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="sendImage(this)">
        </label>
        <input type="text" id="message-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <div class="modal" id="add-friend-modal">
    <div class="modal-content">
      <h3>友達追加</h3>
      <input type="text" id="friend-id-input" placeholder="相手のPeer IDを入力">
      <input type="text" id="friend-name-input" placeholder="表示名 (任意)">
      <button class="btn" onclick="addFriend()">追加</button>
      <button class="btn btn-secondary" onclick="closeModal('add-friend-modal')">キャンセル</button>
    </div>
  </div>

  <div class="modal" id="create-group-modal">
    <div class="modal-content">
      <h3>グループ作成</h3>
      <input type="text" id="group-name-input" placeholder="グループ名">
      <button class="btn" onclick="createGroup()">作成</button>
      <button class="btn btn-secondary" onclick="closeModal('create-group-modal')">キャンセル</button>
    </div>
  </div>

  <div class="modal" id="add-member-modal">
    <div class="modal-content">
      <h3>メンバーを追加</h3>
      <div id="add-member-list"></div>
      <button class="btn" onclick="submitAddMembers()">追加</button>
      <button class="btn btn-secondary" onclick="closeModal('add-member-modal')">キャンセル</button>
    </div>
  </div>

  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <h3>管理者パネル (BAN / UNBAN)</h3>
      <div>
        <label><input type="checkbox" id="admin-mode-toggle" onchange="toggleAdminStatus()"> 管理者モードを有効化</label>
      </div>
      <hr>
      <h4>BANリスト管理</h4>
      <input type="text" id="ban-id-input" placeholder="BAN/UNBANするID">
      <div style="display:flex; gap:8px;">
        <button class="btn btn-danger" style="flex:1;" onclick="banUser()">BAN</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="unbanUser()">UNBAN</button>
      </div>
      <div id="banned-list-display" style="font-size:0.8em; max-height:100px; overflow-y:auto; border:1px solid #ccc; padding:5px;"></div>
      <button class="btn btn-secondary" onclick="closeModal('admin-modal')">閉じる</button>
    </div>
  </div>

  <div class="image-viewer" id="image-viewer" onclick="closeImageViewer()">
    <img id="image-viewer-img" src="" alt="Enlarged Image">
  </div>

  <script>
    let peer = null;
    let myId = '';
    let myName = 'ユーザー';
    let isAdmin = false;

    let friends = {}; // { id: { name: '...' } }
    let groups = {};  // { id: { name: '...', members: [] } }
    let messages = {}; // { targetId: [ { sender, text, img, time, isSystem } ] }
    let bannedUsers = [];
    let connections = {};

    let activeTab = 'friends';
    let activeTargetId = null;

    // 初期化
    window.onload = () => {
      loadDataFromStorage();
      initPeer();
      renderLists();
    };

    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('display-id').innerText = `ID: ${myId} (クリックでコピー)`;
      });

      peer.on('connection', (conn) => {
        setupConnection(conn);
      });
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
      });

      conn.on('data', (data) => {
        if (bannedUsers.includes(conn.peer)) return;
        handleIncomingData(conn.peer, data);
      });

      conn.on('close', () => {
        delete connections[conn.peer];
      });
    }

    function handleIncomingData(senderId, data) {
      if (data.type === 'chat') {
        const targetId = data.groupId || senderId;
        saveMessage(targetId, {
          sender: senderId,
          text: data.text,
          img: data.img,
          time: data.time || getCurrentTime()
        });
      } else if (data.type === 'group-sync') {
        groups[data.groupId] = {
          name: data.groupName,
          members: data.members
        };
        saveDataToStorage();
        renderLists();
      }
    }

    function saveMessage(targetId, msgObj) {
      if (!messages[targetId]) messages[targetId] = [];
      messages[targetId].push(msgObj);
      saveDataToStorage();

      if (activeTargetId === targetId) {
        renderMessages();
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeTargetId) return;

      const time = getCurrentTime();
      const msgData = { type: 'chat', text, time };

      if (activeTab === 'friends') {
        msgData.groupId = null;
        sendToPeer(activeTargetId, msgData);
      } else {
        msgData.groupId = activeTargetId;
        const group = groups[activeTargetId];
        if (group) {
          group.members.forEach(mId => {
            if (mId !== myId) sendToPeer(mId, msgData);
          });
        }
      }

      saveMessage(activeTargetId, { sender: myId, text, time });
      input.value = '';
    }

    function sendImage(inputElement) {
      const file = inputElement.files[0];
      if (!file || !activeTargetId) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgSrc = e.target.result;
        const time = getCurrentTime();
        const msgData = { type: 'chat', img: imgSrc, time };

        if (activeTab === 'friends') {
          msgData.groupId = null;
          sendToPeer(activeTargetId, msgData);
        } else {
          msgData.groupId = activeTargetId;
          const group = groups[activeTargetId];
          if (group) {
            group.members.forEach(mId => {
              if (mId !== myId) sendToPeer(mId, msgData);
            });
          }
        }

        saveMessage(activeTargetId, { sender: myId, img: imgSrc, time });
        inputElement.value = '';
      };
      reader.readAsDataURL(file);
    }

    function sendToPeer(peerId, data) {
      if (bannedUsers.includes(peerId)) return;
      if (connections[peerId]) {
        connections[peerId].send(data);
      } else {
        const conn = peer.connect(peerId);
        conn.on('open', () => {
          connections[peerId] = conn;
          conn.send(data);
        });
        setupConnection(conn);
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      if (tab === 'friends') {
        document.querySelectorAll('.tab')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
      }
      renderLists();
    }

    function renderLists() {
      const container = document.getElementById('list-container');
      container.innerHTML = '';

      if (activeTab === 'friends') {
        Object.keys(friends).forEach(fId => {
          const f = friends[fId];
          const div = document.createElement('div');
          div.className = 'list-item';
          div.onclick = () => selectTarget(fId, f.name);
          div.innerHTML = `
            <div class="avatar">${f.name.charAt(0)}</div>
            <div class="item-details">
              <div class="item-title">${escapeHTML(f.name)}</div>
              <div class="item-sub">ID: ${fId}</div>
            </div>
          `;
          container.appendChild(div);
        });
      } else {
        Object.keys(groups).forEach(gId => {
          const g = groups[gId];
          const div = document.createElement('div');
          div.className = 'list-item';
          div.onclick = () => selectTarget(gId, g.name);
          div.innerHTML = `
            <div class="avatar" style="background:#00b0ff;">G</div>
            <div class="item-details">
              <div class="item-title">${escapeHTML(g.name)}</div>
              <div class="item-sub">${g.members.length} 人的メンバー</div>
            </div>
          `;
          container.appendChild(div);
        });
      }
    }

    function selectTarget(id, name) {
      activeTargetId = id;
      document.getElementById('chat-title').innerText = name;
      document.getElementById('chat-actions').style.display = (activeTab === 'groups') ? 'block' : 'none';
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (!activeTargetId || !messages[activeTargetId]) return;

      messages[activeTargetId].forEach(msg => {
        const row = document.createElement('div');
        const isMyMsg = msg.sender === myId;
        row.className = `msg-row ${isMyMsg ? 'my-msg' : ''}`;

        let bodyContent = '';
        if (msg.text) bodyContent = escapeHTML(msg.text);
        if (msg.img) bodyContent = `<img src="${msg.img}" style="max-width:200px; border-radius:8px; cursor:pointer;" onclick="openImageViewer('${msg.img}')">`;

        row.innerHTML = `
          <div class="msg-bubble">${bodyContent}</div>
          <div class="msg-time">${msg.time || ''}</div>
        `;
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    function addFriend() {
      const id = document.getElementById('friend-id-input').value.trim();
      const name = document.getElementById('friend-name-input').value.trim() || id;

      if (!id) return;
      friends[id] = { name };
      saveDataToStorage();
      closeModal('add-friend-modal');
      renderLists();
    }

    function createGroup() {
      const name = document.getElementById('group-name-input').value.trim();
      if (!name) return;

      const gId = 'group_' + Date.now();
      groups[gId] = {
        name,
        members: [myId]
      };
      saveDataToStorage();
      closeModal('create-group-modal');
      switchTab('groups');
    }

    function openAddMemberModal() {
      if (!activeTargetId || activeTab !== 'groups') return;
      const listDiv = document.getElementById('add-member-list');
      listDiv.innerHTML = '';

      const currentGroup = groups[activeTargetId];

      Object.keys(friends).forEach(fId => {
        if (!currentGroup.members.includes(fId)) {
          const label = document.createElement('label');
          label.style.display = 'block';
          label.innerHTML = `<input type="checkbox" value="${fId}"> ${escapeHTML(friends[fId].name)}`;
          listDiv.appendChild(label);
        }
      });

      openModal('add-member-modal');
    }

    function submitAddMembers() {
      const group = groups[activeTargetId];
      if (!group) return;

      const checkboxes = document.querySelectorAll('#add-member-list input[type="checkbox"]:checked');
      const newMemberIds = Array.from(checkboxes).map(cb => cb.value);

      group.members = Array.from(new Set([...group.members, ...newMemberIds]));
      saveDataToStorage();

      group.members.forEach(mId => {
        if (mId !== myId && connections[mId] && !bannedUsers.includes(mId)) {
          connections[mId].send({
            type: 'group-sync', groupId: activeTargetId, groupName: group.name, members: group.members
          });
        }
      });

      closeModal('add-member-modal');
      renderLists();
    }

    function toggleAdminPanel() {
      renderBannedList();
      openModal('admin-modal');
    }

    function toggleAdminStatus() {
      isAdmin = document.getElementById('admin-mode-toggle').checked;
      document.getElementById('admin-tag').style.display = isAdmin ? 'inline-block' : 'none';
      saveDataToStorage();
    }

    function banUser() {
      const id = document.getElementById('ban-id-input').value.trim();
      if (id && !bannedUsers.includes(id)) {
        bannedUsers.push(id);
        saveDataToStorage();
        renderBannedList();
      }
    }

    function unbanUser() {
      const id = document.getElementById('ban-id-input').value.trim();
      if (id) {
        bannedUsers = bannedUsers.filter(uId => uId !== id);
        saveDataToStorage();
        renderBannedList();
      }
    }

    function renderBannedList() {
      const display = document.getElementById('banned-list-display');
      display.innerHTML = 'BANリスト:<br>' + bannedUsers.join('<br>');
    }

    function openImageViewer(src) {
      document.getElementById('image-viewer-img').src = src;
      document.getElementById('image-viewer').classList.add('active');
    }

    function closeImageViewer() {
      document.getElementById('image-viewer').classList.remove('active');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function copyMyId() {
      if (!myId) return;
      navigator.clipboard.writeText(myId);
      alert('IDをコピーしました: ' + myId);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function saveDataToStorage() {
      localStorage.setItem('chaman_friends', JSON.stringify(friends));
      localStorage.setItem('chaman_groups', JSON.stringify(groups));
      localStorage.setItem('chaman_messages', JSON.stringify(messages));
      localStorage.setItem('chaman_banned', JSON.stringify(bannedUsers));
      localStorage.setItem('chaman_isAdmin', JSON.stringify(isAdmin));
    }

    function loadDataFromStorage() {
      friends = JSON.parse(localStorage.getItem('chaman_friends') || '{}');
      groups = JSON.parse(localStorage.getItem('chaman_groups') || '{}');
      messages = JSON.parse(localStorage.getItem('chaman_messages') || '{}');
      bannedUsers = JSON.parse(localStorage.getItem('chaman_banned') || '[]');
      isAdmin = JSON.parse(localStorage.getItem('chaman_isAdmin') || 'false');

      document.getElementById('admin-mode-toggle').checked = isAdmin;
      document.getElementById('admin-tag').style.display = isAdmin ? 'inline-block' : 'none';
    }
  </script>
</body>
</html>
