<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 80%;
            max-width: 600px;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 139, 253, 0.3);
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 { margin-bottom: 20px; letter-spacing: 2px; }
        input[type="password"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #2ea043; }
        .status { margin-top: 20px; font-weight: bold; }
        .log {
            margin-top: 15px;
            padding: 10px;
            background: #0d1117;
            border-radius: 6px;
            min-height: 50px;
            text-align: left;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>J.A.R.V.I.S.</h1>
    <input type="password" id="apiKey" placeholder="Google Gemini API Keyを入力してください">
    <br>
    <button id="micBtn" onclick="startListening()">話しかける</button>
    <div class="status" id="status">システム待機中...</div>
    <div class="log" id="userLog"><strong>あなた:</strong> -</div>
    <div class="log" id="jarvisLog"><strong>JARVIS:</strong> -</div>
</div>

<script>
    // ブラウザの音声認識機能のセットアップ
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;

        recognition.onstart = () => {
            document.getElementById('status').innerText = '音声を聞き取っています...';
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            document.getElementById('userLog').innerHTML = `<strong>あなた:</strong> ${userText}`;
            document.getElementById('status').innerText = 'JARVIS思考中...';

            // Python（Flaskサーバー）へデータを送信
            const apiKey = document.getElementById('apiKey').value;
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText, apiKey: apiKey })
                });

                const data = await response.json();

                if (data.reply) {
                    document.getElementById('jarvisLog').innerHTML = `<strong>JARVIS:</strong> ${data.reply}`;
                    document.getElementById('status').innerText = '応答完了';
                    speak(data.reply); // 音声で喋らせる
                } else {
                    alert('エラー: ' + (data.error || '応答の取得に失敗しました'));
                    document.getElementById('status').innerText = 'エラー発生';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = '通信エラー';
            }
        };

        recognition.onerror = (e) => {
            document.getElementById('status').innerText = '音声認識エラー: ' + e.error;
        };
    } else {
        alert('お使いのブラウザは音声認識に対応していません。Google Chrome等でお試しください。');
    }

    function startListening() {
        if (!document.getElementById('apiKey').value) {
            alert('Gemini API Keyを入力してください。');
            return;
        }
        recognition.start();
    }

    // JARVISに喋らせる（Web Speech Synthesis）
    function speak(text) {
        window.speechSynthesis.cancel(); // 前の発声を停止
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.pitch = 0.9; // 少し落ち着いたトーン
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
    }
</script>

</body>
</html>
