<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Piano Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            font-size: 24px;
        }

        p {
            margin: 0 0 15px 0;
            color: #ccc;
            font-size: 14px;
        }

        /* ピアノ全体の容器 */
        .piano-container {
            position: relative;
            display: flex;
            background-color: #000;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            touch-action: manipulation;
        }

        /* 白鍵 */
        .white-key {
            width: 50px;
            height: 200px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .white-key.active {
            background: #e0e0e0;
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 黒鍵 */
        .black-key {
            width: 30px;
            height: 120px;
            background: #111;
            border-radius: 0 0 3px 3px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            margin-left: -15px; /* 白鍵の境界線上に配置 */
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            color: #fff;
            font-size: 11px;
        }

        .black-key.active {
            background: #444;
            transform: translateY(2px);
        }

        /* スマホ向けレスポンシブ対応 */
        @media (max-width: 600px) {
            .white-key {
                width: 40px;
                height: 160px;
                font-size: 12px;
            }
            .black-key {
                width: 24px;
                height: 95px;
                margin-left: -12px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <h1>🎵 ミニピアノ 🎵</h1>
    <p>画面をタップ／クリックするか、対応するPCキーボードを押してください</p>

    <div class="piano-container">
        <!-- 白鍵 -->
        <div class="white-key" data-note="C4" data-key="a">A<br>(ド)</div>
        <div class="white-key" data-note="D4" data-key="s">S<br>(レ)</div>
        <div class="white-key" data-note="E4" data-key="d">D<br>(ミ)</div>
        <div class="white-key" data-note="F4" data-key="f">F<br>(ファ)</div>
        <div class="white-key" data-note="G4" data-key="g">G<br>(ソ)</div>
        <div class="white-key" data-note="A4" data-key="h">H<br>(ラ)</div>
        <div class="white-key" data-note="B4" data-key="j">J<br>(シ)</div>
        <div class="white-key" data-note="C5" data-key="k">K<br>(ド)</div>

        <!-- 黒鍵（位置は left プロパティで白鍵の間に調整） -->
        <div class="black-key" style="left: 50px;" data-note="C#4" data-key="w">W</div>
        <div class="black-key" style="left: 100px;" data-note="D#4" data-key="e">E</div>
        <div class="black-key" style="left: 200px;" data-note="F#4" data-key="t">T</div>
        <div class="black-key" style="left: 250px;" data-note="G#4" data-key="y">Y</div>
        <div class="black-key" style="left: 300px;" data-note="A#4" data-key="u">U</div>
    </div>

    <script>
        // 音階ごとの周波数（Hz）定義
        const noteFrequencies = {
            'C4': 261.63,  // ド
            'C#4': 277.18, // ド#
            'D4': 293.66,  // レ
            'D#4': 311.13, // レ#
            'E4': 329.63,  // ミ
            'F4': 349.23,  // ファ
            'F#4': 369.99, // ファ#
            'G4': 392.00,  // ソ
            'G#4': 415.30, // ソ#
            'A4': 440.00,  // ラ
            'A#4': 466.16, // ラ#
            'B4': 493.88,  // シ
            'C5': 523.25   // ド(高)
        };

        // Web Audio API の初期化
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        // 音を鳴らす関数
        function playNote(note) {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }

            const freq = noteFrequencies[note];
            if (!freq) return;

            // オシレーター（発振器）と ゲイン（音量調節）の作成
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle'; // ピアノに近い柔らかい波形（'sine', 'square', 'sawtooth', 'triangle'）
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // 音の余韻（エンベロープ）を設定
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2); // 1.2秒かけて減衰

            // 接続と再生
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        // キー操作・タップのイベント登録
        const keys = document.querySelectorAll('.white-key, .black-key');

        function triggerKey(keyElement) {
            if (!keyElement) return;
            const note = keyElement.getAttribute('data-note');
            playNote(note);

            // 押した時の見た目効果
            keyElement.classList.add('active');
            setTimeout(() => keyElement.classList.remove('active'), 150);
        }

        // タッチ / クリック イベント
        keys.forEach(key => {
            key.addEventListener('touchstart', (e) => {
                e.preventDefault(); // スクロール防止
                triggerKey(key);
            });

            key.addEventListener('mousedown', () => {
                triggerKey(key);
            });
        });

        // PCのキーボード入力対応
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return; // 長押しでの連打防止
            const pressedKey = e.key.toLowerCase();
            const targetKey = document.querySelector(`[data-key="${pressedKey}"]`);
            if (targetKey) {
                triggerKey(targetKey);
            }
        });
    </script>
</body>
</html>
