<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web Piano with Interactive Sheet</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin: 10px 0; font-size: 24px; }

        /* コントロールパネル */
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        select { background: #333; color: white; border: 1px solid #555; }
        button { background: #ff4757; color: white; font-weight: bold; }
        button:hover { background: #ff6b81; }

        /* 簡易楽譜ディスプレイ */
        .sheet-container {
            width: 100%;
            max-width: 900px;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sheet-title { font-size: 18px; color: #ffa502; margin-bottom: 10px; }
        .notes-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
            min-height: 40px;
            align-items: center;
        }

        .note-badge {
            padding: 6px 12px;
            background: #333;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .note-badge.current {
            background: #2ed573;
            color: #000;
            border-color: #2ed573;
            transform: scale(1.15);
        }

        /* 拡大したピアノ容器 */
        .piano-scroll-wrapper {
            width: 100%;
            max-width: 1000px;
            overflow-x: auto;
            background: #000;
            padding: 15px 10px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .piano-container {
            position: relative;
            display: flex;
            width: max-content;
            margin: 0 auto;
        }

        /* 鍵盤サイズを拡大 (幅60px / 高さ240px) */
        .white-key {
            width: 55px;
            height: 240px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .white-key.active, .white-key.guide {
            background: #747d8c;
            transform: translateY(2px);
        }
        .white-key.guide { background: #2ed573 !important; color: #000; }

        .black-key {
            width: 34px;
            height: 145px;
            background: #111;
            border-radius: 0 0 3px 3px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            margin-left: -17px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #fff;
            font-size: 11px;
        }

        .black-key.active, .black-key.guide { background: #57606f; }
        .black-key.guide { background: #2ed573 !important; color: #000; }
    </style>
</head>
<body>

    <h1>🎹 インタラクティブ・ピアノ 🎹</h1>

    <div class="controls">
        <select id="songSelect">
            <option value="twinkle">きらきら星</option>
            <option value="tulip">チューリップ</option>
            <option value="joy">歓喜の歌（ベートーヴェン）</option>
        </select>
        <button id="playDemoBtn">お手本演奏を聴く</button>
    </div>

    <!-- 簡易楽譜表示エリア -->
    <div class="sheet-container">
        <div class="sheet-title" id="songTitle">演奏ガイド</div>
        <div class="notes-display" id="notesDisplay">
            曲を選んで「お手本演奏」を押すか、自力で弾いてみましょう！
        </div>
    </div>

    <!-- 拡大・拡張版鍵盤 (2オクターブ超) -->
    <div class="piano-scroll-wrapper">
        <div class="piano-container" id="piano">
            <!-- 白鍵 -->
            <div class="white-key" data-note="C3">C3<br>(ド)</div>
            <div class="white-key" data-note="D3">D3<br>(レ)</div>
            <div class="white-key" data-note="E3">E3<br>(ミ)</div>
            <div class="white-key" data-note="F3">F3<br>(ファ)</div>
            <div class="white-key" data-note="G3">G3<br>(ソ)</div>
            <div class="white-key" data-note="A3">A3<br>(ラ)</div>
            <div class="white-key" data-note="B3">B3<br>(シ)</div>

            <div class="white-key" data-note="C4">C4<br>(ド)</div>
            <div class="white-key" data-note="D4">D4<br>(レ)</div>
            <div class="white-key" data-note="E4">E4<br>(ミ)</div>
            <div class="white-key" data-note="F4">F4<br>(ファ)</div>
            <div class="white-key" data-note="G4">G4<br>(ソ)</div>
            <div class="white-key" data-note="A4">A4<br>(ラ)</div>
            <div class="white-key" data-note="B4">B4<br>(シ)</div>

            <div class="white-key" data-note="C5">C5<br>(ド)</div>
            <div class="white-key" data-note="D5">D5<br>(レ)</div>
            <div class="white-key" data-note="E5">E5<br>(ミ)</div>

            <!-- 黒鍵（自動配置） -->
        </div>
    </div>

    <script>
        // 音源周波数マッピング (C3〜E5)
        const noteFrequencies = {
            'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25
        };

        // 楽曲データ（楽譜とリズム情報）
        const songs = {
            twinkle: {
                title: "きらきら星",
                notes: [
                    { note: 'C4', duration: 400 }, { note: 'C4', duration: 400 },
                    { note: 'G4', duration: 400 }, { note: 'G4', duration: 400 },
                    { note: 'A4', duration: 400 }, { note: 'A4', duration: 400 },
                    { note: 'G4', duration: 800 },
                    { note: 'F4', duration: 400 }, { note: 'F4', duration: 400 },
                    { note: 'E4', duration: 400 }, { note: 'E4', duration: 400 },
                    { note: 'D4', duration: 400 }, { note: 'D4', duration: 400 },
                    { note: 'C4', duration: 800 }
                ]
            },
            tulip: {
                title: "チューリップ",
                notes: [
                    { note: 'C4', duration: 400 }, { note: 'D4', duration: 400 }, { note: 'E4', duration: 800 },
                    { note: 'C4', duration: 400 }, { note: 'D4', duration: 400 }, { note: 'E4', duration: 800 },
                    { note: 'G4', duration: 400 }, { note: 'E4', duration: 400 }, { note: 'D4', duration: 400 }, { note: 'C4', duration: 400 },
                    { note: 'D4', duration: 400 }, { note: 'E4', duration: 400 }, { note: 'D4', duration: 800 }
                ]
            },
            joy: {
                title: "歓喜の歌",
                notes: [
                    { note: 'E4', duration: 400 }, { note: 'E4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'G4', duration: 400 },
                    { note: 'G4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'E4', duration: 400 }, { note: 'D4', duration: 400 },
                    { note: 'C4', duration: 400 }, { note: 'C4', duration: 400 }, { note: 'D4', duration: 400 }, { note: 'E4', duration: 400 },
                    { note: 'E4', duration: 600 }, { note: 'D4', duration: 200 }, { note: 'D4', duration: 800 }
                ]
            }
        };

        // 黒鍵の自動配置処理
        const blackKeyPositions = [
            { note: 'C#3', left: 38 }, { note: 'D#3', left: 93 },
            { note: 'F#3', left: 203 }, { note: 'G#3', left: 258 }, { note: 'A#3', left: 313 },
            { note: 'C#4', left: 423 }, { note: 'D#4', left: 478 },
            { note: 'F#4', left: 588 }, { note: 'G#4', left: 643 }, { note: 'A#4', left: 698 },
            { note: 'C#5', left: 808 }, { note: 'D#5', left: 863 }
        ];

        const piano = document.getElementById('piano');
        blackKeyPositions.forEach(bk => {
            const el = document.createElement('div');
            el.className = 'black-key';
            el.style.left = `${bk.left}px`;
            el.setAttribute('data-note', bk.note);
            el.innerText = bk.note.replace('4','').replace('3','').replace('5','');
            piano.appendChild(el);
        });

        // サウンド再生エンジン
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playNoteSound(note) {
            if (!audioCtx) audioCtx = new AudioContext();
            const freq = noteFrequencies[note];
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.0);
        }

        // キーを押す・視覚効果処理
        function triggerKey(keyElement, isGuide = false) {
            if (!keyElement) return;
            const note = keyElement.getAttribute('data-note');
            playNoteSound(note);

            const activeClass = isGuide ? 'guide' : 'active';
            keyElement.classList.add(activeClass);
            setTimeout(() => keyElement.classList.remove(activeClass), 200);
        }

        // クリック／タップイベント登録
        document.querySelectorAll('.white-key, .black-key').forEach(key => {
            key.addEventListener('mousedown', () => triggerKey(key));
            key.addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerKey(key);
            });
        });

        // 自動演奏とガイド楽譜機能
        let isPlaying = false;
        async function playDemo() {
            if (isPlaying) return;
            isPlaying = true;

            const songKey = document.getElementById('songSelect').value;
            const song = songs[songKey];
            document.getElementById('songTitle').innerText = `演奏中: ${song.title}`;

            const display = document.getElementById('notesDisplay');
            display.innerHTML = song.notes.map((n, i) => `<span class="note-badge" id="badge-${i}">${n.note}</span>`).join('');

            for (let i = 0; i < song.notes.length; i++) {
                const item = song.notes[i];
                const badge = document.getElementById(`badge-${i}`);
                
                // ガイド強調
                if (badge) badge.classList.add('current');
                const keyEl = document.querySelector(`[data-note="${item.note}"]`);
                triggerKey(keyEl, true);

                await new Promise(r => setTimeout(r, item.duration));
                if (badge) badge.classList.remove('current');
            }

            document.getElementById('songTitle').innerText = '演奏完了！自分で弾いてみよう';
            isPlaying = false;
        }

        document.getElementById('playDemoBtn').addEventListener('click', playDemo);
    </script>
</body>
</html>
