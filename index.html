<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude ✕ Gemini 複合AIアプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 10px; }
    .api-keys { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .api-keys input { flex: 1; min-width: 250px; padding: 6px; }
    .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-area textarea { flex: 1; height: 60px; padding: 8px; font-size: 14px; }
    .input-area button { padding: 0 20px; font-size: 16px; cursor: pointer; }
    
    /* 2つのAIの回答を横並びで表示するレイアウト */
    .results-container { display: flex; gap: 15px; }
    .ai-card { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 12px; background-color: #fafafa; }
    .ai-card.claude { border-top: 5px solid #d97706; } /* Claude用カラー */
    .ai-card.gemini { border-top: 5px solid #2563eb; } /* Gemini用カラー */
    .response-content { white-space: pre-wrap; word-break: break-word; min-height: 150px; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

  <h2>Claude ✕ Gemini 比較対話アプリ</h2>

  <!-- APIキー入力欄 -->
  <div class="api-keys">
    <div>
      <label>Claude API Key:</label><br>
      <input type="password" id="claudeKey" placeholder="sk-ant-...">
    </div>
    <div>
      <label>Gemini API Key:</label><br>
      <input type="password" id="geminiKey" placeholder="AIzaSy...">
    </div>
  </div>

  <!-- 質問入力欄 -->
  <div class="input-area">
    <textarea id="promptInput" placeholder="両方のAIに同時に質問する内容を入力してください..."></textarea>
    <button onclick="askBothAI()">送信</button>
  </div>

  <!-- 回答表示領域 -->
  <div class="results-container">
    <div class="ai-card claude">
      <h3>Claude (claude-3-5-sonnet)</h3>
      <div id="claudeResponse" class="response-content">ここにClaudeの回答が表示されます</div>
    </div>
    <div class="ai-card gemini">
      <h3>Gemini (gemini-2.5-flash)</h3>
      <div id="geminiResponse" class="response-content">ここにGeminiの回答が表示されます</div>
    </div>
  </div>

  <script>
    async function askBothAI() {
      const claudeKey = document.getElementById('claudeKey').value.trim();
      const geminiKey = document.getElementById('geminiKey').value.trim();
      const prompt = document.getElementById('promptInput').value.trim();

      if (!prompt) return alert("質問を入力してください");
      if (!claudeKey && !geminiKey) return alert("少なくともどちらか一方のAPI Keyを入力してください");

      // UIの初期化
      if (claudeKey) document.getElementById('claudeResponse').innerText = "考え中...";
      if (geminiKey) document.getElementById('geminiResponse').innerText = "考え中...";

      // 両方のAPI呼び出しを並列で実行
      const tasks = [];

      if (claudeKey) {
        tasks.push(callClaudeAPI(claudeKey, prompt));
      } else {
        document.getElementById('claudeResponse').innerText = "API Keyが未入力です";
      }

      if (geminiKey) {
        tasks.push(callGeminiAPI(geminiKey, prompt));
      } else {
        document.getElementById('geminiResponse').innerText = "API Keyが未入力です";
      }

      await Promise.all(tasks);
    }

    // 1. Claude API を呼び出す関数
    async function callClaudeAPI(apiKey, prompt) {
      const container = document.getElementById('claudeResponse');
      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'dangerously-allow-browser-user-api-key': 'true' // ブラウザ直接通信を許可するヘッダー
          },
          body: JSON.stringify({
            model: 'claude-3-5-sonnet-20241022',
            max_tokens: 1000,
            messages: [{ role: 'user', content: prompt }]
          })
        });

        const data = await response.json();
        if (data.content && data.content[0].text) {
          container.innerText = data.content[0].text;
        } else {
          container.innerText = "エラー: " + (data.error?.message || "応答を取得できませんでした");
        }
      } catch (e) {
        container.innerText = "通信エラー: " + e.message;
      }
    }

    // 2. Gemini API を呼び出す関数
    async function callGeminiAPI(apiKey, prompt) {
      const container = document.getElementById('geminiResponse');
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          container.innerText = data.candidates[0].content.parts[0].text;
        } else {
          container.innerText = "エラー: " + (data.error?.message || "応答を取得できませんでした");
        }
      } catch (e) {
        container.innerText = "通信エラー: " + e.message;
      }
    }
  </script>
</body>
</html>
