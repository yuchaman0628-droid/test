<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE風チャットアプリ Ultimate Fix</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #7494C0;
      --header-bg: #273238;
      --my-msg-bg: #85E249;
      --other-msg-bg: #FFFFFF;
      --text-color: #111111;
      --time-color: #4A5568;
      --line-green: #06C755;
      --card-bg: #ffffff;
      --sub-bg: #f7f9fa;
      --border-color: #eee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.3s; }

    /* ダークモード定義 */
    body.dark-mode {
      --bg-color: #1a232a;
      --header-bg: #11181c;
      --my-msg-bg: #005c28;
      --other-msg-bg: #263238;
      --text-color: #f0f0f0;
      --time-color: #a0aec0;
      --card-bg: #1e293b;
      --sub-bg: #0f172a;
      --border-color: #334155;
      background-color: #0f172a;
      color: #f0f0f0;
    }

    .app-container {
      width: 100%; max-width: 420px; height: 90vh; max-height: 750px;
      background-color: var(--card-bg); display: flex; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); border-radius: 16px; overflow: hidden; position: relative;
      transition: background-color 0.3s;
    }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .screen.active { display: flex; }

    /* ヘッダー & プロフィール */
    .home-header { padding: 14px 16px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .my-profile-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .my-profile-card:hover { background: var(--sub-bg); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #e0e0e0; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0; color: #111; }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name { font-weight: bold; font-size: 15px; color: var(--text-color); }
    .profile-status { font-size: 12px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ID表示 & フレンド追加 */
    .id-section { padding: 12px 16px; background-color: var(--sub-bg); border-bottom: 6px solid var(--border-color); font-size: 12px; color: var(--text-color); }
    .id-box { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 6px 10px; border: 1px dashed var(--line-green); border-radius: 6px; margin-top: 4px; font-weight: bold; font-size: 14px; color: var(--text-color); }
    .btn { background: var(--line-green); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-secondary { background: #6c757d; }
    .btn-danger { background: #dc3545; }
    .btn-notify { background: #ff9800; }
    .btn-dark { background: #4a5568; color: white; }
    .btn-small { padding: 4px 8px; font-size: 11px; }

    .input-group { display: flex; gap: 6px; margin-top: 8px; }
    .input-group input { flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; font-size: 13px; background: var(--card-bg); color: var(--text-color); }

    .action-bar { padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); }

    /* リストエリア */
    .list-container { flex: 1; padding: 8px 16px; overflow-y: auto; background: var(--card-bg); }
    .section-title { font-size: 11px; color: #888; font-weight: bold; margin: 10px 0 6px 0; }
    .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; }
    .list-item:hover { background-color: var(--sub-bg); }

    /* チャット画面 */
    #chat-screen { background-color: var(--bg-color); background-size: cover; background-position: center; }
    .chat-header { background-color: var(--header-bg); color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .chat-header-actions { display: flex; gap: 6px; align-items: center; }
    .back-btn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; }
    .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .message { display: flex; align-items: flex-end; gap: 6px; max-width: 80%; }
    .message-content { padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; color: var(--text-color); }
    .message-meta { display: flex; flex-direction: column; align-items: flex-end; font-size: 10px; color: var(--time-color); white-space: nowrap; }
    .read-status { color: #2b5278; font-weight: bold; font-size: 9px; }
    body.dark-mode .read-status { color: #64b5f6; }

    .message.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message.sent .message-content { background-color: var(--my-msg-bg); border-bottom-right-radius: 2px; }

    .message.received { align-self: flex-start; }
    .message.received .message-content { background-color: var(--other-msg-bg); border-bottom-left-radius: 2px; }

    .message-content.sticker { background: transparent !important; font-size: 52px; padding: 0; }
    .message-image { max-width: 180px; max-height: 200px; border-radius: 10px; cursor: pointer; display: block; object-fit: cover; }
    .message-audio { max-width: 200px; height: 40px; }

    /* システム通知メッセージ */
    .system-msg { align-self: center; background: rgba(0,0,0,0.3); color: white; padding: 4px 12px; border-radius: 12px; font-size: 11px; margin: 4px 0; }

    /* 入力エリア */
    .chat-input-container { background-color: var(--card-bg); position: relative; border-top: 1px solid var(--border-color); }
    .chat-input-area { padding: 10px; display: flex; align-items: center; gap: 6px; }
    .chat-input { flex: 1; border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 14px; outline: none; font-size: 14px; background: var(--card-bg); color: var(--text-color); }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 2px; }

    /* 録音表示インジケーター */
    .recording-bar {
      display: none; align-items: center; justify-content: space-between; padding: 8px 14px;
      background: #ffebee; color: #c62828; font-size: 13px; font-weight: bold;
    }
    body.dark-mode .recording-bar { background: #3c1e1e; color: #ef9a9a; }
    .recording-bar.active { display: flex; }
    .pulse-dot { width: 10px; height: 10px; background-color: #e53935; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .sticker-palette {
      display: none; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 12px;
      background: var(--sub-bg); border-top: 1px solid var(--border-color); max-height: 140px; overflow-y: auto; text-align: center; font-size: 28px;
    }
    .sticker-palette.active { display: grid; }
    .sticker-item { cursor: pointer; }

    /* モーダル */
    .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); color: var(--text-color); padding: 20px; border-radius: 12px; width: 85%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .member-select-list { max-height: 140px; overflow-y: auto; border: 1px solid var(--border-color); padding: 6px; border-radius: 6px; }

    /* 画像全画面表示 */
    .image-viewer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
    .image-viewer.active { display: flex; }
    .image-viewer img { max-width: 90%; max-height: 80%; border-radius: 8px; }

    /* 通話画面モーダル */
    .call-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; z-index: 300; flex-direction: column; justify-content: space-between; align-items: center;
      padding: 30px 20px; color: white;
    }
    .call-modal.active { display: flex; }
    .call-info { text-align: center; margin-top: 20px; z-index: 10; }
    .call-avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 40px; margin: 0 auto 12px auto; }
    .call-name { font-size: 20px; font-weight: bold; }
    .call-status { font-size: 14px; color: #aaa; margin-top: 4px; }
    
    .video-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden;
    }
    .remote-video { width: 100%; height: 100%; object-fit: cover; }
    .local-video {
      position: absolute; bottom: 100px; right: 16px; width: 100px; height: 140px;
      object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,0.5); background: #222; z-index: 5;
    }

    .call-actions { display: flex; gap: 20px; margin-bottom: 20px; z-index: 10; }
    .call-btn {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; cursor: pointer; color: white; transition: transform 0.1s;
    }
    .call-btn:active { transform: scale(0.95); }
    .call-btn-accept { background: #28a745; }
    .call-btn-hangup { background: #dc3545; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. ホーム画面 -->
  <div id="home-screen" class="screen active">
    <div class="home-header">
      <span>ホーム</span>
      <div class="header-btns">
        <button class="btn btn-dark btn-small" id="dark-mode-btn" onclick="toggleDarkMode()">🌙 Dark</button>
        <button class="btn btn-notify btn-small" id="notify-perm-btn" onclick="requestNotificationPermission()">🔔 通知許可</button>
      </div>
    </div>

    <!-- プロフィール -->
    <div class="my-profile-card" onclick="openProfileModal()">
      <div class="avatar" id="my-avatar-disp">👤</div>
      <div class="profile-info">
        <div class="profile-name" id="my-name-disp">ユーザー</div>
        <div class="profile-status" id="my-status-disp">タップして編集</div>
      </div>
      <span style="font-size: 12px; color: #aaa;">編集 ✏️</span>
    </div>

    <!-- ID表示 & フレンド追加 -->
    <div class="id-section">
      <div>あなたのID:</div>
      <div class="id-box">
        <span id="my-peer-id">発行中...</span>
        <button class="btn" onclick="copyMyId()">コピー</button>
      </div>
      <div class="input-group">
        <!-- 初期値として user- をセット -->
        <input type="text" id="friend-id-input" value="user-" placeholder="相手のIDを入力...">
        <button class="btn" onclick="addAndConnectFriend()">追加</button>
      </div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar">
      <button class="btn btn-secondary" style="flex: 1;" onclick="openGroupModal()">＋ グループ作成</button>
      <button class="btn btn-danger" onclick="clearAllData()">履歴クリア</button>
    </div>

    <!-- トーク一覧 -->
    <div class="list-container">
      <div class="section-title">グループ</div>
      <div id="group-list"></div>

      <div class="section-title">友達（1対1トーク）</div>
      <div id="friends-list"></div>
    </div>
  </div>

  <!-- 2. チャット画面 -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="openHome()">◀ 戻る</button>
      <span id="chat-target-name" style="font-size: 15px; font-weight: bold;">チャット</span>
      <div class="chat-header-actions">
        <button class="btn btn-secondary btn-small" id="call-audio-btn" onclick="startCall(false)">📞</button>
        <button class="btn btn-secondary btn-small" id="call-video-btn" onclick="startCall(true)">📹</button>
        <button class="btn btn-secondary btn-small" onclick="document.getElementById('wallpaper-file-input').click()">🖼️</button>
        <input type="file" id="wallpaper-file-input" accept="image/*" style="display: none;" onchange="handleWallpaperSelect(event)">
        <button class="btn btn-secondary btn-small" id="add-member-btn" style="display: none;" onclick="openAddMemberModal()">⚙️</button>
      </div>
    </div>

    <div class="chat-messages" id="message-container"></div>

    <div class="chat-input-container">
      <div class="recording-bar" id="recording-bar">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="pulse-dot"></div>
          <span>録音中... (<span id="recording-time">0s</span>)</span>
        </div>
        <button class="btn btn-danger btn-small" onclick="cancelRecording()">キャンセル</button>
      </div>

      <div class="sticker-palette" id="sticker-palette">
        <span class="sticker-item" onclick="sendSticker('👍')">👍</span>
        <span class="sticker-item" onclick="sendSticker('🎉')">🎉</span>
        <span class="sticker-item" onclick="sendSticker('❤️')">❤️</span>
        <span class="sticker-item" onclick="sendSticker('😊')">😊</span>
        <span class="sticker-item" onclick="sendSticker('🔥')">🔥</span>
      </div>

      <form class="chat-input-area" onsubmit="sendTextMessage(event)">
        <button type="button" class="icon-btn" onclick="toggleStickerPalette()">😀</button>
        <button type="button" class="icon-btn" onclick="document.getElementById('image-file-input').click()">📷</button>
        <button type="button" class="icon-btn" id="voice-btn" onclick="toggleVoiceRecording()">🎤</button>
        <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
        <input type="text" id="message-input" class="chat-input" placeholder="メッセージを入力..." autocomplete="off">
        <button type="submit" class="btn">➤</button>
      </form>
    </div>
  </div>

  <!-- モーダル: プロフィール編集 -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal">
      <h3>プロフィール編集</h3>
      <label style="font-size: 12px;">アイコン（絵文字）:</label>
      <input type="text" id="edit-avatar" maxlength="2" value="👤">
      <label style="font-size: 12px;">名前:</label>
      <input type="text" id="edit-name" value="ユーザー">
      <label style="font-size: 12px;">ステータスメッセージ:</label>
      <input type="text" id="edit-status" value="よろしくお願いします！">
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal('profile-modal')">キャンセル</button>
        <button class="btn" onclick="saveProfile()">保存</button>
      </div>
    </div>
  </div>

  <!-- モーダル: 新規グループ作成 -->
  <div class="modal-overlay" id="group-modal">
    <div class="modal">
      <h3>グループ作成</h3>
      <input type="text" id="group-name-input" placeholder="グループ名を入力...">
      <div style="font-size: 12px; color: #666;">メンバーを選択:</div>
      <div class="member-select-list" id="member-select-list"></div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal('group-modal')">キャンセル</button>
        <button class="btn" onclick="createGroup()">作成</button>
      </div>
    </div>
  </div>

  <!-- モーダル: グループメンバー追加 -->
  <div class="modal-overlay" id="add-member-modal">
    <div class="modal">
      <h3>メンバーを追加</h3>
      <div style="font-size: 12px; color: #666;">追加するフレンドを選択:</div>
      <div class="member-select-list" id="add-member-select-list"></div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal('add-member-modal')">キャンセル</button>
        <button class="btn" onclick="submitAddMembers()">追加</button>
      </div>
    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div class="image-viewer" id="image-viewer" onclick="closeImageViewer()">
    <img id="image-viewer-img" src="" alt="拡大画像">
  </div>

  <!-- 音声・ビデオ通話モーダル -->
  <div class="call-modal" id="call-modal">
    <div class="video-container" id="video-container" style="display: none;">
      <video id="remote-video" class="remote-video" autoplay playsinline></video>
      <video id="local-video" class="local-video" autoplay playsinline muted></video>
    </div>
    
    <div class="call-info" id="call-info">
      <div class="call-avatar" id="call-target-avatar">👤</div>
      <div class="call-name" id="call-target-name">相手の名前</div>
      <div class="call-status" id="call-status-text">呼び出し中...</div>
    </div>

    <div class="call-actions">
      <button class="call-btn call-btn-accept" id="accept-call-btn" style="display: none;" onclick="acceptIncomingCall()">📞</button>
      <button class="call-btn call-btn-hangup" onclick="endCall()">📵</button>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'LINE_APP_PERSISTENT_DATA_V3';

  let peer = null;
  let myId = '';
  let myProfile = { name: 'ユーザー', avatar: '👤', status: 'よろしくお願いします！' };

  let connections = {};
  let friends = {};
  let groups = {};
  let messages = {};
  let wallpapers = {}; // 背景画像保存用
  let isDarkMode = false;

  let activeTargetId = null;
  let isGroupTarget = false;

  // 録音関連変数
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let recordTimer = null;
  let recordSeconds = 0;

  // 通話関連変数
  let currentCall = null;
  let localStream = null;
  let incomingCall = null;

  function toggleDarkMode() {
    isDarkMode = !isDarkMode;
    if (isDarkMode) {
      document.body.classList.add('dark-mode');
      document.getElementById('dark-mode-btn').textContent = '☀️ Light';
    } else {
      document.body.classList.remove('dark-mode');
      document.getElementById('dark-mode-btn').textContent = '🌙 Dark';
    }
    saveDataToStorage();
  }

  function checkNotificationPermission() {
    if (!("Notification" in window)) {
      document.getElementById('notify-perm-btn').style.display = 'none';
      return;
    }
    if (Notification.permission === "granted") {
      document.getElementById('notify-perm-btn').textContent = '🔔 通知ON';
      document.getElementById('notify-perm-btn').style.background = '#4CAF50';
    }
  }

  function requestNotificationPermission() {
    if (!("Notification" in window)) return alert("通知機能に対応していません");
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        document.getElementById('notify-perm-btn').textContent = '🔔 通知ON';
        document.getElementById('notify-perm-btn').style.background = '#4CAF50';
        new Notification("LINE風アプリ", { body: "通知が有効化されました！" });
      }
    });
  }

  function sendSystemNotification(senderName, text) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(`新着メッセージ (${senderName})`, { body: text });
    }
  }

  function loadStoredData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (data.myId) myId = data.myId;
        if (data.myProfile) myProfile = data.myProfile;
        if (data.friends) friends = data.friends;
        if (data.groups) groups = data.groups;
        if (data.messages) messages = data.messages;
        if (data.wallpapers) wallpapers = data.wallpapers;
        if (data.isDarkMode) {
          isDarkMode = data.isDarkMode;
          if (isDarkMode) {
            document.body.classList.add('dark-mode');
            document.getElementById('dark-mode-btn').textContent = '☀️ Light';
          }
        }
      } catch (e) { console.error(e); }
    }
    document.getElementById('my-avatar-disp').textContent = myProfile.avatar;
    document.getElementById('my-name-disp').textContent = myProfile.name;
    document.getElementById('my-status-disp').textContent = myProfile.status || '';
  }

  function saveDataToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      myId: myId, myProfile: myProfile, friends: friends, groups: groups, messages: messages, wallpapers: wallpapers, isDarkMode: isDarkMode
    }));
  }

  function clearAllData() {
    if (confirm("すべてのデータを初期化しますか？")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  function playNotificationSound() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.50, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.25);
    } catch (e) {}
  }

  function initPeer() {
    loadStoredData();
    checkNotificationPermission();

    if (!myId) {
      myId = 'user-' + Math.floor(10000 + Math.random() * 90000);
      saveDataToStorage();
    }

    peer = new Peer(myId);

    peer.on('open', (id) => {
      document.getElementById('my-peer-id').textContent = id;
      autoReconnectFriends();
    });

    peer.on('connection', (conn) => setupConnection(conn));

    // 通話着信の受信設定
    peer.on('call', (call) => {
      incomingCall = call;
      const callerProf = friends[call.peer] || { name: call.peer, avatar: '👤' };
      
      document.getElementById('call-target-avatar').textContent = callerProf.avatar;
      document.getElementById('call-target-name').textContent = callerProf.name;
      document.getElementById('call-status-text').textContent = '着信中...';
      document.getElementById('accept-call-btn').style.display = 'flex';
      document.getElementById('video-container').style.display = 'none';
      document.getElementById('call-modal').classList.add('active');
      playNotificationSound();
    });

    renderLists();
  }

  function autoReconnectFriends() {
    Object.keys(friends).forEach(fId => {
      if (!connections[fId]) setupConnection(peer.connect(fId));
    });
  }

  function setupConnection(conn) {
    connections[conn.peer] = conn;

    conn.on('open', () => {
      conn.send({ type: 'profile-sync', profile: myProfile });
      renderLists();
    });

    conn.on('data', (data) => handleIncomingData(conn.peer, data));
    conn.on('close', () => {
      delete connections[conn.peer];
      renderLists();
    });
  }

  function handleIncomingData(fromPeerId, data) {
    if (data.type === 'profile-sync') {
      friends[fromPeerId] = data.profile;
      saveDataToStorage();
      renderLists();
    } 
    else if (data.type === 'chat-msg') {
      const targetId = data.groupId || fromPeerId;
      if (!messages[targetId]) messages[targetId] = [];

      const msgObj = {
        id: data.msgId, senderId: fromPeerId, text: data.text,
        isSticker: data.isSticker, isImage: data.isImage, isAudio: data.isAudio || false, isSystem: data.isSystem || false,
        time: data.time, isMine: false
      };

      messages[targetId].push(msgObj);
      saveDataToStorage();
      playNotificationSound();

      const senderProf = friends[fromPeerId] || { name: '誰か' };
      const displayContent = data.isAudio ? '🎵 ボイスメッセージ' : (data.isImage ? '📷 画像' : (data.isSticker ? 'スタンプ' : data.text));

      if (document.hidden || activeTargetId !== targetId) {
        sendSystemNotification(senderProf.name, displayContent);
      }

      if (document.getElementById('chat-screen').classList.contains('active') && activeTargetId === targetId) {
        renderMessages();
        sendReadReceipt(fromPeerId, [data.msgId]);
      } else {
        renderLists();
      }
    } 
    else if (data.type === 'read-ack') {
      if (messages[fromPeerId]) {
        messages[fromPeerId].forEach(m => { if (data.msgIds.includes(m.id)) m.isRead = true; });
        saveDataToStorage();
        if (activeTargetId === fromPeerId) renderMessages();
      }
    }
    else if (data.type === 'group-sync') {
      groups[data.groupId] = { name: data.groupName, members: data.members };
      saveDataToStorage();
      renderLists();
      if (activeTargetId === data.groupId) renderMessages();
    }
  }

  function sendReadReceipt(toPeerId, msgIds) {
    if (connections[toPeerId]) connections[toPeerId].send({ type: 'read-ack', msgIds: msgIds });
  }

  // フレンド追加処理 (user- の自動保持)
  function addAndConnectFriend() {
    const friendIdInput = document.getElementById('friend-id-input');
    const friendId = friendIdInput.value.trim();
    
    if (!friendId || friendId === 'user-' || friendId === myId) {
      return alert('有効なIDを入力してください');
    }

    if (!friends[friendId]) {
      friends[friendId] = { name: friendId, avatar: '👤', status: '' };
      saveDataToStorage();
    }

    setupConnection(peer.connect(friendId));
    
    // 送信完了後も user- を残す
    friendIdInput.value = 'user-';
  }

  function sendTextMessage(event) {
    event.preventDefault();
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;
    dispatchMessage(text, false, false, false);
    input.value = '';
    document.getElementById('sticker-palette').classList.remove('active');
  }

  function sendSticker(emoji) {
    dispatchMessage(emoji, true, false, false);
    document.getElementById('sticker-palette').classList.remove('active');
  }

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxDim = 800;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
        else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }

        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        
        const base64Data = canvas.toDataURL('image/jpeg', 0.7);
        dispatchMessage(base64Data, false, true, false);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  // 壁紙選択処理
  function handleWallpaperSelect(event) {
    const file = event.target.files[0];
    if (!file || !activeTargetId) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      wallpapers[activeTargetId] = e.target.result;
      saveDataToStorage();
      applyWallpaper(activeTargetId);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function applyWallpaper(targetId) {
    const chatScreen = document.getElementById('chat-screen');
    if (wallpapers[targetId]) {
      chatScreen.style.backgroundImage = `url(${wallpapers[targetId]})`;
    } else {
      chatScreen.style.backgroundImage = 'none';
    }
  }

  // ボイスメッセージ録音処理
  async function toggleVoiceRecording() {
    if (isRecording) {
      stopAndSendRecording();
    } else {
      startRecording();
    }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      recordSeconds = 0;
      document.getElementById('recording-time').textContent = '0s';
      document.getElementById('recording-bar').classList.add('active');
      document.getElementById('voice-btn').style.color = '#e53935';

      recordTimer = setInterval(() => {
        recordSeconds++;
        document.getElementById('recording-time').textContent = recordSeconds + 's';
      }, 1000);

    } catch (err) {
      alert('マイクの使用許可が得られませんでした');
    }
  }

  function stopAndSendRecording() {
    if (!mediaRecorder || !isRecording) return;
    
    mediaRecorder.onstop = () => {
      clearInterval(recordTimer);
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        dispatchMessage(reader.result, false, false, true);
      };
      reader.readAsDataURL(audioBlob);

      resetRecordingState();
    };

    mediaRecorder.stop();
  }

  function cancelRecording() {
    if (mediaRecorder && isRecording) {
      clearInterval(recordTimer);
      mediaRecorder.onstop = () => resetRecordingState();
      mediaRecorder.stop();
    } else {
      resetRecordingState();
    }
  }

  function resetRecordingState() {
    isRecording = false;
    clearInterval(recordTimer);
    document.getElementById('recording-bar').classList.remove('active');
    document.getElementById('voice-btn').style.color = '';
  }

  // 音声・ビデオ通話処理
  async function startCall(isVideo) {
    if (!activeTargetId || isGroupTarget) return alert('1対1のチャット相手と通話可能です');
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
      const targetProf = friends[activeTargetId] || { name: activeTargetId, avatar: '👤' };

      document.getElementById('call-target-avatar').textContent = targetProf.avatar;
      document.getElementById('call-target-name').textContent = targetProf.name;
      document.getElementById('call-status-text').textContent = '発信中...';
      document.getElementById('accept-call-btn').style.display = 'none';
      document.getElementById('call-modal').classList.add('active');

      if (isVideo) {
        document.getElementById('video-container').style.display = 'flex';
        document.getElementById('local-video').srcObject = localStream;
      } else {
        document.getElementById('video-container').style.display = 'none';
      }

      currentCall = peer.call(activeTargetId, localStream);
      setupCallEvents(currentCall);

    } catch (err) {
      alert('カメラまたはマイクのアクセスが拒否されました');
    }
  }

  async function acceptIncomingCall() {
    try {
      const isVideo = incomingCall.metadata && incomingCall.metadata.isVideo;
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });

      document.getElementById('accept-call-btn').style.display = 'none';
      document.getElementById('call-status-text').textContent = '通話中';
      document.getElementById('video-container').style.display = 'flex';
      document.getElementById('local-video').srcObject = localStream;

      incomingCall.answer(localStream);
      currentCall = incomingCall;
      setupCallEvents(currentCall);

    } catch (err) {
      alert('通話の準備に失敗しました');
      endCall();
    }
  }

  function setupCallEvents(call) {
    call.on('stream', (remoteStream) => {
      document.getElementById('call-status-text').textContent = '通話中';
      document.getElementById('remote-video').srcObject = remoteStream;
      document.getElementById('video-container').style.display = 'flex';
    });

    call.on('close', () => endCall());
    call.on('error', () => endCall());
  }

  function endCall() {
    if (currentCall) currentCall.close();
    if (incomingCall) incomingCall.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());

    currentCall = null;
    incomingCall = null;
    localStream = null;

    document.getElementById('call-modal').classList.remove('active');
  }

  function dispatchMessage(content, isSticker, isImage, isAudio, isSystem = false) {
    if (!activeTargetId) return;

    const time = getCurrentTime();
    const msgId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);

    const msgObj = {
      id: msgId, senderId: myId, text: content,
      isSticker: isSticker, isImage: isImage, isAudio: isAudio, isSystem: isSystem,
      time: time, isMine: true, isRead: false
    };

    if (!messages[activeTargetId]) messages[activeTargetId] = [];
    messages[activeTargetId].push(msgObj);
    saveDataToStorage();

    if (!isGroupTarget) {
      if (connections[activeTargetId]) {
        connections[activeTargetId].send({
          type: 'chat-msg', msgId: msgId, text: content, isSticker: isSticker, isImage: isImage, isAudio: isAudio, isSystem: isSystem, time: time
        });
      }
    } else {
      const group = groups[activeTargetId];
      if (group) {
        group.members.forEach(mId => {
          if (mId !== myId && connections[mId]) {
            connections[mId].send({
              type: 'chat-msg', groupId: activeTargetId, msgId: msgId, text: content, isSticker: isSticker, isImage: isImage, isAudio: isAudio, isSystem: isSystem, time: time
            });
          }
        });
      }
    }

    renderMessages();
  }

  function renderMessages() {
    const container = document.getElementById('message-container');
    container.innerHTML = '';

    const msgList = messages[activeTargetId] || [];
    const unreadMsgIds = [];

    msgList.forEach(m => {
      if (!m.isMine && !m.isRead) {
        m.isRead = true;
        unreadMsgIds.push(m.id);
      }

      if (m.isSystem) {
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-msg';
        sysDiv.textContent = m.text;
        container.appendChild(sysDiv);
        return;
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${m.isMine ? 'sent' : 'received'}`;

      const contentDiv = document.createElement('div');

      const isActualImage = m.isImage || (typeof m.text === 'string' && m.text.startsWith('data:image/'));
      const isActualAudio = m.isAudio || (typeof m.text === 'string' && m.text.startsWith('data:audio/'));

      if (isActualImage) {
        contentDiv.className = 'message-content';
        contentDiv.style.padding = '4px';
        contentDiv.style.background = 'transparent';
        const imgEl = document.createElement('img');
        imgEl.src = m.text;
        imgEl.className = 'message-image';
        imgEl.onclick = () => openImageViewer(m.text);
        contentDiv.appendChild(imgEl);
      } else if (isActualAudio) {
        contentDiv.className = 'message-content';
        contentDiv.style.padding = '4px';
        const audioEl = document.createElement('audio');
        audioEl.src = m.text;
        audioEl.controls = true;
        audioEl.className = 'message-audio';
        contentDiv.appendChild(audioEl);
      } else {
        contentDiv.className = `message-content ${m.isSticker ? 'sticker' : ''}`;
        contentDiv.textContent = m.text;
      }

      const metaDiv = document.createElement('div');
      metaDiv.className = 'message-meta';
      let readHtml = (m.isMine && m.isRead) ? `<span class="read-status">既読</span>` : '';
      metaDiv.innerHTML = `${readHtml}<span>${m.time}</span>`;

      msgDiv.appendChild(contentDiv);
      msgDiv.appendChild(metaDiv);
      container.appendChild(msgDiv);
    });

    container.scrollTop = container.scrollHeight;
    if (unreadMsgIds.length > 0) saveDataToStorage();
    if (unreadMsgIds.length > 0 && !isGroupTarget && connections[activeTargetId]) {
      sendReadReceipt(activeTargetId, unreadMsgIds);
    }
  }

  function renderLists() {
    const friendsContainer = document.getElementById('friends-list');
    friendsContainer.innerHTML = '';
    const allFriendIds = Array.from(new Set([...Object.keys(friends), ...Object.keys(connections)]));

    allFriendIds.forEach(fId => {
      const prof = friends[fId] || { name: fId, avatar: '👤', status: '' };
      const isOnline = !!connections[fId];
      const item = document.createElement('div');
      item.className = 'list-item';
      item.onclick = () => openChat(fId, false, prof.name);
      item.innerHTML = `
        <div class="avatar">${prof.avatar}</div>
        <div class="profile-info">
          <div class="profile-name">${escapeHTML(prof.name)}</div>
          <div class="profile-status" style="color: ${isOnline ? 'var(--line-green)' : '#aaa'};">
            ${isOnline ? '● オンライン' : '○ オフライン'}
          </div>
        </div>
      `;
      friendsContainer.appendChild(item);
    });

    const groupsContainer = document.getElementById('group-list');
    groupsContainer.innerHTML = '';
    Object.keys(groups).forEach(gId => {
      const g = groups[gId];
      const item = document.createElement('div');
      item.className = 'list-item';
      item.onclick = () => openChat(gId, true, g.name);
      item.innerHTML = `
        <div class="avatar" style="background:#00b900; color:white;">👥</div>
        <div class="profile-info">
          <div class="profile-name">${escapeHTML(g.name)}</div>
          <div class="profile-status">${g.members.length}人のメンバー</div>
        </div>
      `;
      groupsContainer.appendChild(item);
    });
  }

  function openChat(targetId, isGroup, name) {
    activeTargetId = targetId;
    isGroupTarget = isGroup;
    document.getElementById('chat-target-name').textContent = name;
    document.getElementById('add-member-btn').style.display = isGroup ? 'block' : 'none';
    document.getElementById('call-audio-btn').style.display = isGroup ? 'none' : 'block';
    document.getElementById('call-video-btn').style.display = isGroup ? 'none' : 'block';

    applyWallpaper(targetId);

    document.getElementById('home-screen').classList.remove('active');
    document.getElementById('chat-screen').classList.add('active');
    renderMessages();
  }

  function openHome() {
    activeTargetId = null;
    document.getElementById('chat-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
    renderLists();
  }

  function toggleStickerPalette() {
    document.getElementById('sticker-palette').classList.toggle('active');
  }

  function openProfileModal() {
    document.getElementById('edit-avatar').value = myProfile.avatar;
    document.getElementById('edit-name').value = myProfile.name;
    document.getElementById('edit-status').value = myProfile.status;
    document.getElementById('profile-modal').classList.add('active');
  }

  function saveProfile() {
    myProfile.avatar = document.getElementById('edit-avatar').value.trim() || '👤';
    myProfile.name = document.getElementById('edit-name').value.trim() || 'ユーザー';
    myProfile.status = document.getElementById('edit-status').value.trim();

    document.getElementById('my-avatar-disp').textContent = myProfile.avatar;
    document.getElementById('my-name-disp').textContent = myProfile.name;
    document.getElementById('my-status-disp').textContent = myProfile.status;
    saveDataToStorage();

    Object.values(connections).forEach(conn => conn.send({ type: 'profile-sync', profile: myProfile }));
    closeModal('profile-modal');
  }

  function openGroupModal() {
    const list = document.getElementById('member-select-list');
    list.innerHTML = '';
    const allFriendIds = Array.from(new Set([...Object.keys(friends), ...Object.keys(connections)]));
    allFriendIds.forEach(fId => {
      const prof = friends[fId] || { name: fId };
      const div = document.createElement('label');
      div.style.display = 'block';
      div.style.padding = '4px 0';
      div.style.fontSize = '13px';
      div.innerHTML = `<input type="checkbox" value="${fId}"> ${escapeHTML(prof.name)}`;
      list.appendChild(div);
    });
    document.getElementById('group-modal').classList.add('active');
  }

  function createGroup() {
    const name = document.getElementById('group-name-input').value.trim();
    if (!name) return alert('グループ名を入力してください');
    const selectedMembers = [myId];
    document.querySelectorAll('#member-select-list input:checked').forEach(cb => selectedMembers.push(cb.value));
    if (selectedMembers.length < 2) return alert('メンバーを選択してください');

    const groupId = 'group-' + Date.now();
    groups[groupId] = { name: name, members: selectedMembers };
    saveDataToStorage();

    selectedMembers.forEach(mId => {
      if (mId !== myId && connections[mId]) {
        connections[mId].send({ type: 'group-sync', groupId: groupId, groupName: name, members: selectedMembers });
      }
    });

    closeModal('group-modal');
    renderLists();
  }

  function openAddMemberModal() {
    const list = document.getElementById('add-member-select-list');
    list.innerHTML = '';

    const group = groups[activeTargetId];
    if (!group) return;

    const allFriendIds = Array.from(new Set([...Object.keys(friends), ...Object.keys(connections)]));
    const candidates = allFriendIds.filter(fId => !group.members.includes(fId));

    if (candidates.length === 0) {
      list.innerHTML = '<div style="font-size:12px; color:#999; padding:10px; text-align:center;">追加できる新しいフレンドがいません</div>';
    } else {
      candidates.forEach(fId => {
        const prof = friends[fId] || { name: fId };
        const div = document.createElement('label');
        div.style.display = 'block';
        div.style.padding = '4px 0';
        div.style.fontSize = '13px';
        div.innerHTML = `<input type="checkbox" value="${fId}"> ${escapeHTML(prof.name)}`;
        list.appendChild(div);
      });
    }

    document.getElementById('add-member-modal').classList.add('active');
  }

  function submitAddMembers() {
    const group = groups[activeTargetId];
    if (!group) return;

    const newMemberIds = [];
    document.querySelectorAll('#add-member-select-list input:checked').forEach(cb => {
      newMemberIds.push(cb.value);
    });

    if (newMemberIds.length === 0) return closeModal('add-member-modal');

    group.members = Array.from(new Set([...group.members, ...newMemberIds]));
    saveDataToStorage();

    group.members.forEach(mId => {
      if (mId !== myId && connections[mId]) {
        connections[mId].send({
          type: 'group-sync', groupId: activeTargetId, groupName: group.name, members: group.members
        });
      }
    });

    const addedNames = newMemberIds.map(id => (friends[id] ? friends[id].name : id)).join('、');
    dispatchMessage(`${addedNames} がグループに参加しました`, false, false, false, true);

    closeModal('add-member-modal');
    renderLists();
  }

  function openImageViewer(src) {
    document.getElementById('image-viewer-img').src = src;
    document.getElementById('image-viewer').classList.add('active');
  }

  function closeImageViewer() {
    document.getElementById('image-viewer').classList.remove('active');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function getCurrentTime() {
    const now = new Date();
    return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }

  function copyMyId() {
    navigator.clipboard.writeText(myId);
    alert('IDをコピーしました: ' + myId);
  }

  function escapeHTML(str) {
    return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  window.onload = initPeer;
</script>

</body>
